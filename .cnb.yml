## 将 CNB 仓库镜像同步到 GitHub，触发 EdgeOne Pages 自动部署
## 凭证通过 imports 从密钥仓库导入（shisheng820/git-key 仓库的 git-push.yml）：
##   GIT_PUSH_USER   - GitHub 用户名
##   GIT_PUSH_TOKEN  - GitHub Personal Access Token（需 repo 权限）
## GitHub 仓库名与 CNB 同名（textdb-edgeone），如不同请修改下方 GITHUB_REPO 变量
##
## 分支匹配：glob 分组 "(main|dev)" 匹配 main 或 dev 分支

## ============================================================
## 云原生开发环境 — 打开开发环境时自动执行
## 参考: https://cnb.cool/cnb/cool/default-dev-env
## ============================================================
$:
  vscode:
    - docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
        services:
          - vscode
          - docker
        stages:
          - name: install dependencies
            script: npm install
          - name: verify build
            script: npm run typecheck && npm run lint

## 分支匹配：glob 分组 "(main|dev)" 匹配 main 或 dev 分支
"(main|dev)":
  push:
    - name: sync-to-github
      runner:
        cpus: 1
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages:
        - name: mirror-to-github
          script: |
            set -e
            echo "同步分支 ${CNB_BRANCH} 到 GitHub: ${GIT_PUSH_USER}/${GITHUB_REPO}"
            # 配置 GitHub 远程仓库（使用 token 认证）
            git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
              git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"
            # 推送当前分支与所有标签到 GitHub
            git push github "HEAD:${CNB_BRANCH}" --force --tags
            echo "✅ 已同步到 GitHub"
