## 将 CNB 仓库镜像同步到 GitHub，触发 EdgeOne Pages 自动部署
## 凭证通过 imports 从密钥仓库导入（shisheng820/git-key 仓库的 git-push.yml）：
##   GIT_PUSH_USER   - GitHub 用户名
##   GIT_PUSH_TOKEN  - GitHub Personal Access Token（需 repo 权限）
## GitHub 仓库名与 CNB 同名（textdb-edgeone），如不同请修改下方 GITHUB_REPO 变量
##
## 分支匹配：glob 分组 "(main|dev)" 匹配 main 或 dev 分支

## ============================================================
## 云原生开发环境 — 打开开发环境时自动执行
## 参考: https://cnb.cool/cnb/cool/default-dev-env
## ============================================================
$:
  vscode:
    - docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
        services:
          - vscode
          - docker
        stages:
          - name: install dependencies
            script: npm install
          - name: verify build
            script: npm run typecheck && npm run lint

  ## ============================================================
  ## 手动触发：CNB → GitHub 镜像同步（参考 simplereader 工作流）
  ## 在仓库页面手动点击触发，支持运行变量控制推送行为：
  ##   PUSH_BRANCH  - 指定要推送的分支（空格分隔），默认推送所有本地分支
  ##   FORCE_PUSH   - 设为 true 时使用 --force 强制推送
  ##   PUSH_TAGS    - 设为 false 时跳过标签推送
  ##   DRY_RUN      - 设为 true 时只打印将执行的操作，不实际推送
  ## 凭证与 push 自动同步一致：通过 imports 从 git-key 密钥仓库导入
  ## ============================================================
  web_trigger:
    - name: sync-to-github-manual
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages:
        - name: validate-credentials
          script: |
            if [ -z "$GIT_PUSH_USER" ] || [ -z "$GIT_PUSH_TOKEN" ]; then
              echo "ERROR: GIT_PUSH_USER / GIT_PUSH_TOKEN 未配置（需通过 git-key imports 导入）"
              echo "Please check CNB pipeline imports"
              exit 78
            fi

        - name: configure-git
          script: |
            git config user.name "cnb-sync[bot]"
            git config user.email "cnb-sync[bot]@users.noreply.github.com"

        - name: add-github-remote
          script: |
            git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
              git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"

        - name: push-branches
          script: |
            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            BRANCHES="${PUSH_BRANCH}"
            if [ -z "$BRANCHES" ]; then
              BRANCHES=$(git branch --format='%(refname:short)' 2>/dev/null || git branch | sed 's/^\* //')
            fi

            for BRANCH in $BRANCHES; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "[DRY RUN] Would push: branch ${BRANCH} -> github ${BRANCH} ${FORCE_FLAG}"
              else
                echo "Pushing branch: ${BRANCH}"
                git push github "${BRANCH}" ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
              fi
            done

        - name: push-tags
          script: |
            if [ "${PUSH_TAGS}" = "false" ]; then
              echo "Skipping tags (PUSH_TAGS=false)"
              exit 0
            fi

            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "[DRY RUN] Would push: all tags ${FORCE_FLAG}"
              git tag -l | head -20
            else
              echo "Pushing all tags..."
              git push github --tags ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push some tags"
            fi

        - name: summary
          script: |
            echo "=== CNB → GitHub Sync Summary ==="
            echo "Target: ${GIT_PUSH_USER}/${GITHUB_REPO}"
            echo "Force Push: ${FORCE_PUSH:-false}"
            echo "Branches: ${PUSH_BRANCH:-all local}"
            echo "Tags: ${PUSH_TAGS:-true}"
            echo "Dry Run: ${DRY_RUN:-false}"
            echo "==============================="

## 分支匹配：glob 分组 "(main|dev)" 匹配 main 或 dev 分支
"(main|dev)":
  push:
    - name: sync-to-github
      runner:
        cpus: 1
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages:
        - name: mirror-to-github
          script: |
            set -e
            echo "同步分支 ${CNB_BRANCH} 到 GitHub: ${GIT_PUSH_USER}/${GITHUB_REPO}"
            # 配置 GitHub 远程仓库（使用 token 认证）
            git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
              git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"
            # 推送当前分支与所有标签到 GitHub
            git push github "HEAD:${CNB_BRANCH}" --force --tags
            echo "✅ 已同步到 GitHub"
