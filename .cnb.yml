## ============================================================
## textdb-edgeone — CNB 流水线
## 参考 simplereader 的 .cnb.yml / .cnb/web_trigger.yml 工作流结构
##
## 环境边界：
##   - dev / 其他分支：只允许部署到 EdgeOne Pages 预发环境（preview）
##   - master 分支：允许部署到生产环境（production）
##
## 部署由 CNB 触发（push 自动 / 手动按钮），不依赖 GitHub 自动部署
##
## 密钥仓库：
##   - shisheng820/secret  → edgeone.yml 提供 EDGEONE_PAGES_API_TOKEN
##   - shisheng820/git-key → git-push.yml 提供 GIT_PUSH_USER / GIT_PUSH_TOKEN
## ============================================================

# ===== 公共配置：Node 构建环境 =====
# 使用 node:22（Debian 完整镜像）而非 node:22-alpine：
# alpine 自带 npm 10.8.x 存在 arborist loadPeerSet bug (npm/cli#9787)，
# 安装 edgeone CLI 时会崩溃 "Cannot read properties of null (reading 'edgesOut')"
.node-env: &node-env
  docker:
    image: node:22

# ===== EdgeOne Pages 部署：方案 A（不传目录，由 CLI 自动构建） =====
# 本项目为 Edge Functions 项目，使用官方 edgeone CLI 部署。
# `edgeone pages deploy` 不传目录路径时，CLI 会自行完成构建后再上传：
#   1) 按 edgeone.json 执行 installCommand / buildCommand
#   2) 扫描仓库根 edge-functions/[[default]].js → 打包为 .edgeone/edge-functions/（catch-all 路由）
#   3) dist/ → .edgeone/assets/，生成 .edgeone/routes.json，再整体上传
# 为什么必须「不传目录」（两次翻车记录）：
#   - `deploy .edgeone`：CLI 以传入目录为上传根展开相对路径，其过滤器含
#     `FilePath.startsWith(".") && FilePath !== basename(FilePath)` 条件，
#     `.edgeone/xxx` 形式的路径全部命中被跳过 → 上传 0 个文件 → 平台 Deploy Failed
#   - `deploy dist`：CLI 视为纯静态直传，不会读取仓库根 edge-functions/ →
#     函数根本没上传 → 线上 /stats、/update/ 等 API 全部 404
# 注意：edge-functions/[[default]].js 必须是 catch-all 文件名（index.js 只匹配根路径）
#
# ===== 函数代码包体积校验（deploy 脚本内，build 之后、deploy 之前）=====
# 官方限制（pages.edgeone.ai/zh/document/limits-and-quotas）：
#   Edge Functions 代码包大小 = 5 MB / 单个函数（非全项目总量口径）
# 事故背景：2026-09 修复前 build-edge.cjs 会内联整个 dist，v1.3.0 引入
#   mermaid/katex/swagger 后 dist 达 7.1 MB → 函数产物 9.5 MB 超限。
#   平台此时**仍返回 Deploy Success**，只是函数不生效、线上 API 全部 404，
#   CI 全绿无法感知，只能靠线上 curl 才发现。
# 阈值设计：
#   硬失败 = 5 MB（官方硬上限，当前正常值 19 KB，余量 274 倍，不可能误杀）
#   预警   = 256 KB（正常值约 19 KB 的 13 倍）
#   为何不只按 5 MB 判断：仅一个门槛拦不住「误内联 dist 但未超限」的情况——
#   历史 master 版本函数为 705 KB（同样内联了整个 dist）却低于 5 MB，
#   只会在前端继续变大后才突然超限崩溃。预警线 256 KB 与正常值（19 KB）
#   有 13 倍间距、与最小事故值（705 KB）有 2.7 倍间距，可提前暴露且不误报。
#   WARN 不阻断流水线（避免阻碍函数体积的合理增长），只在日志中提示。
.deploy-preview: &deploy-preview
  - name: validate-edgeone-token
    script: |
      if [ -z "$EDGEONE_PAGES_API_TOKEN" ]; then
        echo "ERROR: EDGEONE_PAGES_API_TOKEN 未配置（需通过 secret/edgeone.yml imports 导入）"
        echo "请在 EdgeOne Pages 控制台创建 API Token 并加入密钥仓库"
        exit 78
      fi
  - name: install-edgeone-cli
    script: |
      # npm v10.8.x arborist loadPeerSet bug (npm/cli#9787)：npx 临时安装 edgeone 会崩溃
      # 改用全局安装 + --legacy-peer-deps 绕过 peer 依赖解析 bug
      npm config set legacy-peer-deps true
      npm install -g edgeone --legacy-peer-deps
  - name: build-and-deploy-preview
    script: |
      # 预构建：确保仓库根 edge-functions/[[default]].js 是最新产物（CLI 扫描的就是它）
      npm install
      npm run build
      # ---- 函数代码包体积校验（阈值依据见文件头部「体积校验」一节）----
      LIMIT_FAIL=$((5 * 1024 * 1024))
      LIMIT_WARN=$((256 * 1024))
      FUNC_COUNT=0
      SIZE_STATUS=0
      for f in $(find edge-functions -type f -name '*.js' 2>/dev/null | sort); do
        FUNC_COUNT=$((FUNC_COUNT + 1))
        SIZE=$(stat -c%s "$f")
        if [ "$SIZE" -gt "$LIMIT_FAIL" ]; then
          echo "✘ FAIL: $f = $((SIZE / 1024)) KB，超过 EdgeOne 单函数代码包上限 5 MB"
          echo "        疑似 build-edge.cjs 误把整个 dist 内联进函数（应只内联 index.html）"
          SIZE_STATUS=1
        elif [ "$SIZE" -gt "$LIMIT_WARN" ]; then
          echo "⚠ WARN: $f = $((SIZE / 1024)) KB，超过 256 KB 预警线（正常约 19 KB）"
          echo "        请确认未误内联静态资源；官方硬上限为 5 MB"
        else
          echo "✔ $f = $((SIZE / 1024)) KB（官方上限 5 MB）"
        fi
      done
      if [ "$FUNC_COUNT" = "0" ]; then
        echo "✘ FAIL: edge-functions/ 下未找到 .js 函数产物，构建可能未生效"
        SIZE_STATUS=1
      fi
      [ "$SIZE_STATUS" = "0" ] || exit 1
      # 关键：不传目录路径 —— 由 CLI 自动构建 .edgeone 后再上传（见上方「部署方案 A」）
      edgeone pages deploy -n textdb-edgeone -e preview -t "$EDGEONE_PAGES_API_TOKEN"

# ===== EdgeOne Pages 部署：生产环境（方案同预发，不传目录；不带 -e 即 production） =====
.deploy-production: &deploy-production
  - name: validate-edgeone-token
    script: |
      if [ -z "$EDGEONE_PAGES_API_TOKEN" ]; then
        echo "ERROR: EDGEONE_PAGES_API_TOKEN 未配置（需通过 secret/edgeone.yml imports 导入）"
        echo "请在 EdgeOne Pages 控制台创建 API Token 并加入密钥仓库"
        exit 78
      fi
  - name: install-edgeone-cli
    script: |
      # npm v10.8.x arborist loadPeerSet bug (npm/cli#9787)：npx 临时安装 edgeone 会崩溃
      # 改用全局安装 + --legacy-peer-deps 绕过 peer 依赖解析 bug
      npm config set legacy-peer-deps true
      npm install -g edgeone --legacy-peer-deps
  - name: build-and-deploy-production
    script: |
      # 预构建：确保仓库根 edge-functions/[[default]].js 是最新产物（CLI 扫描的就是它）
      npm install
      npm run build
      # ---- 函数代码包体积校验（阈值依据见文件头部「体积校验」一节）----
      LIMIT_FAIL=$((5 * 1024 * 1024))
      LIMIT_WARN=$((256 * 1024))
      FUNC_COUNT=0
      SIZE_STATUS=0
      for f in $(find edge-functions -type f -name '*.js' 2>/dev/null | sort); do
        FUNC_COUNT=$((FUNC_COUNT + 1))
        SIZE=$(stat -c%s "$f")
        if [ "$SIZE" -gt "$LIMIT_FAIL" ]; then
          echo "✘ FAIL: $f = $((SIZE / 1024)) KB，超过 EdgeOne 单函数代码包上限 5 MB"
          echo "        疑似 build-edge.cjs 误把整个 dist 内联进函数（应只内联 index.html）"
          SIZE_STATUS=1
        elif [ "$SIZE" -gt "$LIMIT_WARN" ]; then
          echo "⚠ WARN: $f = $((SIZE / 1024)) KB，超过 256 KB 预警线（正常约 19 KB）"
          echo "        请确认未误内联静态资源；官方硬上限为 5 MB"
        else
          echo "✔ $f = $((SIZE / 1024)) KB（官方上限 5 MB）"
        fi
      done
      if [ "$FUNC_COUNT" = "0" ]; then
        echo "✘ FAIL: edge-functions/ 下未找到 .js 函数产物，构建可能未生效"
        SIZE_STATUS=1
      fi
      [ "$SIZE_STATUS" = "0" ] || exit 1
      # 关键：不传目录路径（见上方「部署方案 A」）
      edgeone pages deploy -n textdb-edgeone -t "$EDGEONE_PAGES_API_TOKEN"

# ===== GitHub 同步公共 stages（自动版：当前分支 + tags） =====
.sync-github: &sync-github
  - name: validate-github-credentials
    script: |
      if [ -z "$GIT_PUSH_USER" ] || [ -z "$GIT_PUSH_TOKEN" ]; then
        echo "ERROR: GIT_PUSH_USER / GIT_PUSH_TOKEN 未配置（需通过 git-key imports 导入）"
        exit 78
      fi
  - name: add-github-remote
    script: |
      git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
        git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"
  - name: push-branch-and-tags
    script: |
      BRANCH="${CNB_BRANCH}"
      echo "Pushing branch: ${BRANCH}"
      git push github "${BRANCH}" --force 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
      echo "Pushing all tags..."
      git push github --tags --force 2>&1 || echo "WARN: failed to push some tags"

## ============================================================
## dev 分支：push 自动 → 部署预发环境 + 同步 GitHub
## ============================================================
dev:
  push:
    - name: deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-preview

    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

## ============================================================
## master 分支：push 自动 → 部署生产环境 + 同步 GitHub
## ============================================================
master:
  push:
    - name: deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-production

    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

## ============================================================
## $ 兜底（其他分支）+ 手动触发
##   其他分支 push → 只同步 GitHub（不自动部署）
##   手动触发按钮可见性由 .cnb/web_trigger.yml 控制：
##     - master：部署到生产 / 部署到预发 / 同步 GitHub
##     - 其他分支：部署到预发 / 同步 GitHub
## ============================================================
$:
  vscode:
    - docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
        services:
          - vscode
          - docker
        stages:
          - name: install dependencies
            script: npm install
          - name: verify build
            script: npm run typecheck && npm run lint

  ## 其他分支 push → 只同步 GitHub
  push:
    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

  ## 手动触发：部署预发（master + 其他分支显示）
  web_trigger_deploy_preview:
    - name: deploy-preview-manual
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-preview

  ## 手动触发：部署生产（仅 master 显示）
  web_trigger_deploy_production:
    - name: deploy-production-manual
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-production

  ## 手动触发：同步到 GitHub（master + 其他分支显示，支持运行变量）
  web_trigger_sync:
    - name: sync-to-github-manual
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages:
        - name: validate-credentials
          script: |
            if [ -z "$GIT_PUSH_USER" ] || [ -z "$GIT_PUSH_TOKEN" ]; then
              echo "ERROR: GIT_PUSH_USER / GIT_PUSH_TOKEN 未配置（需通过 git-key imports 导入）"
              exit 78
            fi

        - name: add-github-remote
          script: |
            git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
              git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"

        - name: push-branches
          script: |
            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            BRANCHES="${PUSH_BRANCH}"
            if [ -z "$BRANCHES" ]; then
              BRANCHES=$(git branch --format='%(refname:short)' 2>/dev/null || git branch | sed 's/^\* //')
            fi

            for BRANCH in $BRANCHES; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "[DRY RUN] Would push: branch ${BRANCH} -> github ${BRANCH} ${FORCE_FLAG}"
              else
                echo "Pushing branch: ${BRANCH}"
                git push github "${BRANCH}" ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
              fi
            done

        - name: push-tags
          script: |
            if [ "${PUSH_TAGS}" = "false" ]; then
              echo "Skipping tags (PUSH_TAGS=false)"
              exit 0
            fi

            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "[DRY RUN] Would push: all tags ${FORCE_FLAG}"
              git tag -l | head -20
            else
              echo "Pushing all tags..."
              git push github --tags ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push some tags"
            fi

        - name: summary
          script: |
            echo "=== CNB → GitHub Sync Summary ==="
            echo "Target: ${GIT_PUSH_USER}/${GITHUB_REPO}"
            echo "Force Push: ${FORCE_PUSH:-false}"
            echo "Branches: ${PUSH_BRANCH:-all local}"
            echo "Tags: ${PUSH_TAGS:-true}"
            echo "Dry Run: ${DRY_RUN:-false}"
            echo "==============================="
