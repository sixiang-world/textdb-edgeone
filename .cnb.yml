## ============================================================
## textdb-edgeone — CNB 流水线
## 参考 simplereader 的 .cnb.yml / .cnb/web_trigger.yml 工作流结构
##
## 环境边界：
##   - dev / 其他分支：只允许部署到 EdgeOne Pages 预发环境（preview）
##   - master 分支：允许部署到生产环境（production）
##
## 部署由 CNB 触发（push 自动 / 手动按钮），不依赖 GitHub 自动部署
##
## 密钥仓库：
##   - shisheng820/secret  → edgeone.yml 提供 EDGEONE_PAGES_API_TOKEN
##   - shisheng820/git-key → git-push.yml 提供 GIT_PUSH_USER / GIT_PUSH_TOKEN
## ============================================================

# ===== 公共配置：Node 构建环境 =====
.node-env: &node-env
  docker:
    image: node:22

# ===== EdgeOne Pages 部署：预发环境 =====
# 本项目为 Edge Functions 项目，使用官方 edgeone CLI 部署
# （自动执行 npm install + npm run build，并打包 edge-functions 一起上传）
.deploy-preview: &deploy-preview
  - name: validate-edgeone-token
    script: |
      if [ -z "$EDGEONE_PAGES_API_TOKEN" ]; then
        echo "ERROR: EDGEONE_PAGES_API_TOKEN 未配置（需通过 secret/edgeone.yml imports 导入）"
        echo "请在 EdgeOne Pages 控制台创建 API Token 并加入密钥仓库"
        exit 78
      fi
  - name: 部署到 EdgeOne Pages 预发环境
    script: |
      npx --yes edgeone pages deploy -n textdb-edgeone -e preview -t "$EDGEONE_PAGES_API_TOKEN"

# ===== EdgeOne Pages 部署：生产环境 =====
.deploy-production: &deploy-production
  - name: validate-edgeone-token
    script: |
      if [ -z "$EDGEONE_PAGES_API_TOKEN" ]; then
        echo "ERROR: EDGEONE_PAGES_API_TOKEN 未配置（需通过 secret/edgeone.yml imports 导入）"
        echo "请在 EdgeOne Pages 控制台创建 API Token 并加入密钥仓库"
        exit 78
      fi
  - name: 部署到 EdgeOne Pages 生产环境
    script: |
      npx --yes edgeone pages deploy -n textdb-edgeone -t "$EDGEONE_PAGES_API_TOKEN"

# ===== GitHub 同步公共 stages（自动版：当前分支 + tags） =====
.sync-github: &sync-github
  - name: validate-github-credentials
    script: |
      if [ -z "$GIT_PUSH_USER" ] || [ -z "$GIT_PUSH_TOKEN" ]; then
        echo "ERROR: GIT_PUSH_USER / GIT_PUSH_TOKEN 未配置（需通过 git-key imports 导入）"
        exit 78
      fi
  - name: add-github-remote
    script: |
      git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
        git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"
  - name: push-branch-and-tags
    script: |
      BRANCH="${CNB_BRANCH}"
      echo "Pushing branch: ${BRANCH}"
      git push github "${BRANCH}" --force 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
      echo "Pushing all tags..."
      git push github --tags --force 2>&1 || echo "WARN: failed to push some tags"

## ============================================================
## dev 分支：push 自动 → 部署预发环境 + 同步 GitHub
## ============================================================
dev:
  push:
    - name: deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-preview

    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

## ============================================================
## master 分支：push 自动 → 部署生产环境 + 同步 GitHub
## ============================================================
master:
  push:
    - name: deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-production

    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

## ============================================================
## $ 兜底（其他分支）+ 手动触发
##   其他分支 push → 只同步 GitHub（不自动部署）
##   手动触发按钮可见性由 .cnb/web_trigger.yml 控制：
##     - master：部署到生产 / 部署到预发 / 同步 GitHub
##     - 其他分支：部署到预发 / 同步 GitHub
## ============================================================
$:
  vscode:
    - docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
        services:
          - vscode
          - docker
        stages:
          - name: install dependencies
            script: npm install
          - name: verify build
            script: npm run typecheck && npm run lint

  ## 其他分支 push → 只同步 GitHub
  push:
    - name: sync-to-github
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages: *sync-github

  ## 手动触发：部署预发（master + 其他分支显示）
  web_trigger_deploy_preview:
    - name: deploy-preview-manual
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-preview

  ## 手动触发：部署生产（仅 master 显示）
  web_trigger_deploy_production:
    - name: deploy-production-manual
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      stages: *deploy-production

  ## 手动触发：同步到 GitHub（master + 其他分支显示，支持运行变量）
  web_trigger_sync:
    - name: sync-to-github-manual
      docker:
        image: alpine/git:v2.45.2
      imports:
        - https://cnb.cool/shisheng820/git-key/-/blob/main/git-push.yml
      env:
        GITHUB_REPO: textdb-edgeone
      stages:
        - name: validate-credentials
          script: |
            if [ -z "$GIT_PUSH_USER" ] || [ -z "$GIT_PUSH_TOKEN" ]; then
              echo "ERROR: GIT_PUSH_USER / GIT_PUSH_TOKEN 未配置（需通过 git-key imports 导入）"
              exit 78
            fi

        - name: add-github-remote
          script: |
            git remote add github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git" 2>/dev/null || \
              git remote set-url github "https://${GIT_PUSH_USER}:${GIT_PUSH_TOKEN}@github.com/${GIT_PUSH_USER}/${GITHUB_REPO}.git"

        - name: push-branches
          script: |
            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            BRANCHES="${PUSH_BRANCH}"
            if [ -z "$BRANCHES" ]; then
              BRANCHES=$(git branch --format='%(refname:short)' 2>/dev/null || git branch | sed 's/^\* //')
            fi

            for BRANCH in $BRANCHES; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "[DRY RUN] Would push: branch ${BRANCH} -> github ${BRANCH} ${FORCE_FLAG}"
              else
                echo "Pushing branch: ${BRANCH}"
                git push github "${BRANCH}" ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
              fi
            done

        - name: push-tags
          script: |
            if [ "${PUSH_TAGS}" = "false" ]; then
              echo "Skipping tags (PUSH_TAGS=false)"
              exit 0
            fi

            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "[DRY RUN] Would push: all tags ${FORCE_FLAG}"
              git tag -l | head -20
            else
              echo "Pushing all tags..."
              git push github --tags ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push some tags"
            fi

        - name: summary
          script: |
            echo "=== CNB → GitHub Sync Summary ==="
            echo "Target: ${GIT_PUSH_USER}/${GITHUB_REPO}"
            echo "Force Push: ${FORCE_PUSH:-false}"
            echo "Branches: ${PUSH_BRANCH:-all local}"
            echo "Tags: ${PUSH_TAGS:-true}"
            echo "Dry Run: ${DRY_RUN:-false}"
            echo "==============================="
